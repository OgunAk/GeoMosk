# Yerel demo ortamı. Portlar yalnızca 127.0.0.1'e bağlanır; anonim yazma API'si dış ağa açılmaz.
# Değişkenler .env dosyasından (bkz. .env.example); yoksa yerel geliştirme varsayılanları kullanılır.
#
# Roller: POSTGRES_USER = şema sahibi (migration + import), geomosk_app = API çalışma rolü (superuser değil).
# Veri importu otomatik değildir:  docker compose --profile tools run --rm import
name: geomosk

x-owner-connection: &owner-connection "Host=db;Port=5432;Database=${POSTGRES_DB:-geomosk};Username=${POSTGRES_USER:-geomosk};Password=${POSTGRES_PASSWORD:-geomosk_dev};Timeout=5"

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geomosk}
      POSTGRES_USER: ${POSTGRES_USER:-geomosk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geomosk_dev}
      GEOMOSK_APP_USER: geomosk_app
      GEOMOSK_APP_PASSWORD: ${GEOMOSK_APP_PASSWORD:-geomosk_app_dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - geomosk-db:/var/lib/postgresql/data
      - ./docker/db/initdb:/docker-entrypoint-initdb.d:ro
      - ./docker/db/sql:/geomosk-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./backend
      target: migrator
    environment:
      MIGRATION_CONNECTION: *owner-connection
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__GeoMosk: "Host=db;Port=5432;Database=${POSTGRES_DB:-geomosk};Username=geomosk_app;Password=${GEOMOSK_APP_PASSWORD:-geomosk_app_dev};Timeout=5"
      Cors__AllowedOrigins__0: "http://localhost:${WEB_PORT:-8080}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"

  import:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: scripts/import/Dockerfile
    environment:
      GEOMOSK_IMPORT_DATABASE_URL: "postgres://${POSTGRES_USER:-geomosk}:${POSTGRES_PASSWORD:-geomosk_dev}@db:5432/${POSTGRES_DB:-geomosk}"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  geomosk-db:
