# Tarayıcı yalnızca bu origin'i görür; /api istekleri compose ağındaki api servisine aktarılır.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 2m;

    # GeoJSON yanıtları metin ağırlıklı; proxy edilen API yanıtları da sıkıştırılır.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/problem+json text/css application/javascript;

    # API container'ı yeniden başlayınca IP'si değişebilir; ad, Docker'ın iç DNS'iyle (127.0.0.11) her 10 sn'de bir
    # yeniden çözülür. Sabit "proxy_pass http://api:8080" adresi açılışta bir kez çözüp eski IP'de 502 veriyordu.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API dokümantasyonu (ADR-0018): 8080/swagger arayüzü ve /openapi şeması da API'ye aktarılır.
    location ~ ^/(swagger|openapi)(/|$) {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;

        # nginx'in mime.types dosyasında .mjs yok (application/octet-stream döner); tarayıcı modül
        # worker'ını (MapLibre) JavaScript olmayan MIME ile çalıştırmaz. Yalnızca .mjs için türü belirle.
        location ~* \.mjs$ {
            types { }
            default_type text/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
    }

    location / {
        try_files $uri /index.html;
    }
}
