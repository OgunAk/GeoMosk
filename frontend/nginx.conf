# Tarayıcı yalnızca bu origin'i görür; /api istekleri compose ağındaki api servisine aktarılır.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 2m;

    # GeoJSON yanıtları metin ağırlıklı; proxy edilen API yanıtları da sıkıştırılır.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/problem+json text/css application/javascript;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;

        # nginx'in mime.types dosyasında .mjs yok (application/octet-stream döner); tarayıcı modül
        # worker'ını (MapLibre) JavaScript olmayan MIME ile çalıştırmaz. Yalnızca .mjs için türü belirle.
        location ~* \.mjs$ {
            types { }
            default_type text/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
    }

    location / {
        try_files $uri /index.html;
    }
}
