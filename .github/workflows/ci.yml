name: CI

on:
  push:
    branches: [main, master, "faz-*"]
  pull_request:

permissions:
  contents: read

jobs:
  tooling:
    name: Claude altyapısı ve hook testleri
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/verify-agent-setup.mjs
      - run: npm run test:hooks

  backend:
    name: Backend build + test (gerçek PostGIS, Testcontainers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Import entegrasyon testleri scripts/import/load-osm.mjs'i (Node + pg) gerçek PostGIS'e karşı çalıştırır.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: dotnet restore backend
      - run: dotnet build backend --no-restore --nologo
      - run: dotnet test backend --no-build --nologo --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/**/TestResults/*.trx

  frontend:
    name: Frontend typecheck, lint, test, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    name: Uçtan uca (Compose + gerçek veri + Playwright)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - run: docker compose --profile tools run --rm import
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
      - if: always()
        run: docker compose logs --no-color api migrate | tail -n 200
